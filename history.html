<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historial de Cambios · Matrícula Escolar</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="history.css" />
</head>
<body>

    <!-- ============ HEADER ============ -->
    <header class="history-header">
        <div class="header-left">
            <h1>📜 Historial de Cambios</h1>
            <p class="subtitle">Registro de auditoría de la tabla <strong>alumnos</strong></p>
        </div>
        <div class="header-right">
            <button class="btn btn-outline btn-sm" id="refreshBtn">🔄 Actualizar</button>
            <a href="index.html" class="btn btn-primary btn-sm">← Volver al Dashboard</a>
        </div>
    </header>

    <!-- ============ FILTROS ============ -->
    <section class="filters">
        <div class="filter-group">
            <label for="searchInput">Buscar</label>
            <input type="text" id="searchInput" placeholder="🔍 Nombre del alumno, usuario o campo..." />
        </div>
        <div class="filter-group">
            <label for="actionFilter">Acción</label>
            <select id="actionFilter">
                <option value="">Todas</option>
                <option value="INSERT">➕ Insertar</option>
                <option value="UPDATE">✏️ Actualizar</option>
                <option value="DELETE">🗑️ Eliminar</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="userFilter">Usuario</label>
            <select id="userFilter">
                <option value="">Todos</option>
            </select>
        </div>
        <div class="filter-group filter-counter">
            <span id="recordCount">0 registros</span>
        </div>
    </section>

    <!-- ============ CONTENIDO ============ -->
    <main id="historyContainer" class="history-container">
        <div class="loading-state">
            <span class="spinner"></span>
            <p>Cargando historial...</p>
        </div>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="history-footer">
        <span id="lastUpdate">Última actualización: —</span>
        <span>Gestión de Matrícula Escolar · Año 2025-2026</span>
    </footer>

    <!-- ============ TOASTS ============ -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="history.js"></script>
</body>
</html>
